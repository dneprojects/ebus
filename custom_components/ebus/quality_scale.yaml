# Home Assistant integration quality scale checklist for `ebus`.
# Target tier: bronze (all bronze rules met). Silver/gold/platinum rules are
# tracked here as done / todo / exempt toward a later promotion.
rules:
  # --- Bronze ---------------------------------------------------------------
  action-setup: done
  appropriate-polling: done
  brands:
    status: todo
    comment: Icons live under brand/ locally; submit them to home-assistant/brands.
  common-modules: done
  config-flow-test-coverage: done
  config-flow: done
  dependency-transparency: done
  docs-actions: done
  docs-high-level-description: done
  docs-installation-instructions: done
  docs-removal-instructions: done
  entity-event-setup: done
  entity-unique-id: done
  has-entity-name: done
  runtime-data: done
  test-before-configure: done
  test-before-setup: done
  unique-config-entry: done

  # --- Silver ---------------------------------------------------------------
  action-exceptions: done
  config-entry-unloading: done
  docs-configuration-parameters: todo
  docs-installation-parameters: todo
  entity-unavailable:
    status: done
    comment: A sensor without a value is unavailable; every bus entity is once the link has been down for 10 minutes (the adapter's own entities keep reporting).
  integration-owner: done
  log-when-unavailable: done
  parallel-updates:
    status: done
    comment: The platforms declare PARALLEL_UPDATES = 0; the coordinator updates them, and the engine sends one telegram at a time.
  reauthentication-flow:
    status: exempt
    comment: The adapter needs no credentials, so there is nothing to re-authenticate.
  test-coverage:
    status: todo
    comment: The config flow, a full setup with platforms, setup retry, link loss, the entry migrations, the write path, controls, translations and late climate zones are covered; per-platform entity tests are pending.

  # --- Gold -----------------------------------------------------------------
  devices: done
  diagnostics: done
  discovery:
    status: done
    comment: An adapter advertising _ebusd._tcp over mDNS is offered (zeroconf), once a probe shows it streams eBUS symbols.
  discovery-update-info:
    status: done
    comment: The same adapter found at a new address updates its entry's host.
  docs-data-update: todo
  docs-examples: todo
  docs-known-limitations:
    status: todo
    comment: Document the single-client adapter constraint (cannot run alongside ebusd).
  docs-supported-devices: todo
  docs-supported-functions: todo
  docs-troubleshooting: todo
  docs-use-cases: todo
  dynamic-devices:
    status: todo
    comment: Devices are scanned once at setup; runtime add/remove is not handled yet.
  entity-category:
    status: done
    comment: The adapter's and the identification entities are diagnostic; installer settings are configuration.
  entity-device-class: done
  entity-disabled-by-default: done
  entity-translations: done
  exception-translations:
    status: todo
    comment: Write failures raise HomeAssistantError with plain messages, not translation keys.
  icon-translations:
    status: todo
    comment: Icons are set per entity via _attr_icon rather than an icons.json translation.
  reconfiguration-flow:
    status: todo
    comment: An options flow exists; host/port reconfiguration is not offered.
  repair-issues:
    status: exempt
    comment: No user-actionable repair scenarios are defined yet.
  stale-devices:
    status: done
    comment: Phantom addresses of a unit found elsewhere are removed at setup; the user can delete any device the current bus no longer backs.

  # --- Platinum -------------------------------------------------------------
  async-dependency: done
  inject-websession:
    status: exempt
    comment: The bus link is a raw asyncio TCP connection; the optional definition download uses Home Assistant's shared aiohttp session.
  strict-typing:
    status: done
    comment: CI runs mypy --strict on the whole integration against Home Assistant; aioebus ships its type hints (py.typed).
