name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      # test against the aioebus release users get: the manifest's requirement
      - run: pip install "$(python -c 'import json; print(json.load(open("custom_components/ebus/manifest.json"))["requirements"][0])')"
      - run: ruff check .
      - run: mypy custom_components/ebus
      - run: python -m pytest -q

  # Home Assistant's own checks: manifest, translations, quality scale, config flow
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # what HACS checks before it installs the repository
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          # the icons ship in the integration (brand/), not in home-assistant/brands;
          # the repository has no GitHub topics
          ignore: brands topics
