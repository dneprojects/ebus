name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements_test.txt
      # test against the aioebus release users get: the manifest's requirement
      - run: pip install "$(python -c 'import json; print(json.load(open("custom_components/ebus/manifest.json"))["requirements"][0])')"
      - run: ruff check .
      - run: python -m pytest -q
